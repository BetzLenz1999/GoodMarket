<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play &amp; Earn participants — {{ report_date }} to {{ report_end_date }} | GoodMarket</title>
    <style>
        :root { color-scheme: dark; } * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; font-family:Inter,system-ui,sans-serif; color:#f8fafc; background:radial-gradient(circle at top,#581c87 0%,#111827 46%,#020617 100%); }
        .wrap { width:min(1000px,calc(100% - 32px)); margin:0 auto; padding:32px 0 56px; } .top { display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem; }
        .back { color:#e9d5ff;font-weight:700;text-decoration:none; } .hero,.summary,.participant { border:1px solid rgba(255,255,255,.12);background:rgba(15,23,42,.76);box-shadow:0 18px 60px rgba(0,0,0,.22); }
        .hero { border-radius:24px;padding:24px;margin-bottom:20px; } h1 { margin:0 0 8px;font-size:clamp(1.8rem,5vw,3rem); } .muted { color:rgba(248,250,252,.68); }
        .picker { display:flex;gap:.75rem;align-items:end;flex-wrap:wrap;margin-top:20px; } label { display:grid;gap:.4rem;color:#e9d5ff;font-weight:700;font-size:.9rem; } input,button { font:inherit;border-radius:10px;padding:.7rem .85rem; } input { border:1px solid rgba(192,132,252,.45);background:#111827;color:#fff; } button { cursor:pointer;border:0;background:linear-gradient(135deg,#a855f7,#7e22ce);color:#fff;font-weight:800; }
        .share { margin:16px 0 20px;color:rgba(248,250,252,.65);font-size:.9rem;word-break:break-all; } .share code { color:#e9d5ff; } .summary-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:20px; } .summary { border-radius:16px;padding:18px; } .summary span { display:block;color:rgba(248,250,252,.64);font-size:.9rem;font-weight:700; } .summary strong { display:block;margin-top:5px;color:#e9d5ff;font-size:1.7rem; }
        #participants { display:grid;gap:10px; } .participant { border-radius:14px;padding:15px; } .participant-top { display:flex;justify-content:space-between;gap:1rem;align-items:center;margin-bottom:8px; } .amount { color:#86efac;font-weight:800;white-space:nowrap; } .detail { color:rgba(248,250,252,.62);font-size:.86rem;overflow-wrap:anywhere;margin-top:4px; } .detail a { color:#c084fc; } .empty { text-align:center;padding:48px 20px;border:1px dashed rgba(255,255,255,.18);border-radius:18px;color:rgba(248,250,252,.7); } @media(max-width:560px) { .summary-grid { grid-template-columns:1fr; }.participant-top { align-items:flex-start;flex-direction:column;gap:.35rem; } }
    </style>
</head>
<body><main class="wrap">
    <div class="top"><a class="back" href="/">← Back to GoodMarket</a><a class="back" href="/overview">Overview</a></div>
    <section class="hero"><h1>🎮 Play &amp; Earn participants</h1><p class="muted">Participation history from <strong id="report-date-label">{{ report_date }} to {{ report_end_date }}</strong> (UTC). Choose a date range to view every completed minigame reward.</p><div class="picker"><label>Start date<input id="report-start-date" type="date" value="{{ report_date }}"></label><label>End date<input id="report-end-date" type="date" value="{{ report_end_date }}"></label><button type="button" id="open-report">Open report</button></div></section>
    <div class="share">Shareable report URL: <code id="share-url"></code></div><section class="summary-grid"><div class="summary"><span>Total game rewards</span><strong id="participant-count">—</strong></div><div class="summary"><span>Total rewards distributed</span><strong id="reward-total">—</strong></div></section><section id="participants"><div class="empty">Loading participants…</div></section>
</main><script>
const REPORT_START_DATE={{ report_date|tojson }}, REPORT_END_DATE={{ report_end_date|tojson }};
const escapeHtml=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openReport(){const startDate=document.getElementById('report-start-date').value,endDate=document.getElementById('report-end-date').value;if(!startDate||!endDate)return;if(endDate<startDate){window.alert('End date must be on or after the start date.');return;}window.location.assign('/minigames/participants/'+encodeURIComponent(startDate)+'?end_date='+encodeURIComponent(endDate));}
async function loadReport(){document.getElementById('share-url').textContent=window.location.href;const mount=document.getElementById('participants');try{const params=new URLSearchParams({start_date:REPORT_START_DATE,end_date:REPORT_END_DATE}),response=await fetch('/minigames/api/participants?'+params),data=await response.json();if(!data.success)throw new Error(data.error);document.getElementById('participant-count').textContent=data.total_count||0;document.getElementById('reward-total').textContent=data.total_rewards_formatted||'0.00 G$';if(!(data.participants||[]).length){mount.innerHTML='<div class="empty">No Play &amp; Earn rewards found from '+escapeHtml(REPORT_START_DATE)+' to '+escapeHtml(REPORT_END_DATE)+'.</div>';return;}mount.innerHTML=data.participants.map((p,index)=>{const tx=p.transaction_hash&&p.transaction_hash!=='N/A'?'<a target="_blank" rel="noopener" href="https://celoscan.io/tx/'+encodeURIComponent(p.transaction_hash)+'">'+escapeHtml(p.transaction_hash)+'</a>':'Pending';return '<article class="participant"><div class="participant-top"><strong>#'+(index+1)+' · '+escapeHtml(p.display_name)+'</strong><span class="amount">'+escapeHtml(p.reward_formatted)+'</span></div><div class="detail">Game: '+escapeHtml(p.game_type)+'</div><div class="detail">Wallet: '+escapeHtml(p.wallet_address)+'</div><div class="detail">Transaction: '+tx+'</div><div class="detail">Completed: '+escapeHtml(p.timestamp?new Date(p.timestamp).toLocaleString():'—')+'</div></article>';}).join('');}catch(error){mount.innerHTML='<div class="empty">Could not load this report. Please try again later.</div>';}}
document.getElementById('open-report').addEventListener('click',openReport);loadReport();
</script></body></html>
